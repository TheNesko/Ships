name: Build Windows Client

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame pyperclip

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --windowed --hidden-import=pyperclip --clean --name Client client.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v5
        with:
          name: Client-Windows-GUI
          path: dist/Client.exe

      - name: Build Console windows executable
        run: |
          pyinstaller --onefile --hidden-import=pyperclip --clean --name Client_debug client.py

      - name: Upload Console executable
        uses: actions/upload-artifact@v5
        with:
          name: Client-Windows-Console
          path: dist/Client_debug.exe
